name: Python CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: loans
          POSTGRES_USER: loans
          POSTGRES_PASSWORD: loans
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loans -d loans"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-test-secret-not-for-production
      DJANGO_DEBUG: 'false'
      POSTGRES_DB: loans
      POSTGRES_USER: loans
      POSTGRES_PASSWORD: loans
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      REDIS_URL: redis://127.0.0.1:6379/0
      USE_FAKE_AI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Django system checks
        run: python manage.py check
      - name: Check migrations
        run: python manage.py migrate --noinput
      - name: Run tests
        run: python -m pytest -q
